const G={};group(a.data).forEach(g=>G[g.u]=g);const L=new Set(l.data.map(x=>x.user_id)),now=new Date();let c={w:0,l:0,n:0};
const bd=u.data.filter(p=>p.birth_date&&p.birth_date.slice(5)==t.slice(5)).map(p=>esc(p.full_name)).join(', ');const rows=u.data.filter(p=>p.active!==false).map(p=>{const g=G[p.id],lt=late(g?.in,p.shift_start);let s,k='';

else if(L.has(p.id))s='Ruxsatda';else if((p.off_days||[p.off_day]).includes(now.getDay()))s='Dam olish';
else{const[h,m]=p.shift_start.split(':'),st=new Date();st.setHours(+h,+m+GRACE,0,0);if(now>st){s='Kelmadi';k='rejected';c.n++}else s='Kutilmoqda'}

return `<div class=st><div><b>${c.w}</b>Ishda</div><div><b>${c.k||0}</b>Ketdi</div><div><b>${c.l}</b>Kechikdi</div><div><b>${c.n}</b>Kelmadi</div></div>${bd?`<div class=c>🎂 Bugun tug'ilgan kun: <b>${bd}</b></div>`:''}<div class=c><b>Bugun · ${t}</b>${rows||'<p class=m>Xodim yo\'q</p>'}</div>`};
