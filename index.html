<script>
const URL_='https://jabbjwexqkbfksolrxnv.supabase.co',KEY='sb_publishable_FwR9NgYT7b7TOhfq7XV4mw_PNug-1Iq',GRACE=5;

const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',month:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',leave:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',today:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',staff:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M17 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.9"/>',br:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',log:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',lv:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'};
const TE=[['home','Bosh'],['month','Davomat'],['tasks','Vazifa'],['fin','Hisob'],['ann','E\'lon'],['chat','Chat'],['leave','So\'rov'],['prof','Profil']],TA=[['today','Bugun'],['grid','Jadval'],['staff','Xodimlar'],['br','Filial'],['log','Jurnal'],['lv','So\'rovlar'],['atasks','Vazifa'],['pay','Oylik'],['afin','Moliya'],['atrips','Reys'],['aann','E\'lon'],['stat','Statistika'],['fb','Taklif'],['rate','Reyting'],['chat','Chat'],['prof','Profil']];
async function boot(){if(!OK)$('#dm').innerHTML='<div style="background:#FFF3CD;padding:8px 10px;font-size:12px"><b>DEMO rejim</b> (namuna ma\'lumotlar): '+[['u1','Xodim'],['u2','Xodim 2'],['u6','Boshliq'],['u3','Admin']].map(([i,n])=>`<button style="width:auto;padding:4px 10px;margin:2px" onclick="demoId='${i}';boot()">${n}</button>`).join('')+'</div>';
else if(location.protocol.startsWith('http'))navigator.serviceWorker?.register('sw.js');
const{data:{session}}=await db.auth.getSession();if(!session)return login();me=session.user;
const{data}=await db.from('profiles').select('*').eq('id',me.id).single();pf=data;if(!pf)return $('#v').innerHTML='<div class=c><b>Profil topilmadi</b><p class=m>Admin sizni tizimga qo\'shishi kerak.</p></div>';
$('#out').style.display='';$('#who').textContent=pf.full_name;if(OK)db.rpc('touch_device',{d:devId()}).then(({data})=>{if(data=='diff'&&!sessionStorage.getItem('dv')){sessionStorage.setItem('dv',1);tg('admins',pf.full_name+' boshqa qurilmadan kirdi')}});const T=pf.role=='admin'?TA:pf.role=='manager'?TM:pf.role=='driver'?[TE[0],['trips','Reys'],...TE.slice(1)]:TE;

A.login=async()=>{if(!v('e')||!v('p'))return alert('Login va parolni kiriting');const{error}=await db.auth.signInWithPassword({email:(x=>x.includes('@')?x:x+'@kiddy.uz')(v('e').trim().toLowerCase()),password:v('p')});error?alert('Kirish xatosi: '+error.message):boot()};
/* ---------- XODIM ---------- */

const sc=await SC,g=group(data)[0]||{},l=late(g.in,pf.shift_start),st=!g.in?'Hali kelmagansiz':g.out?'Ish tugadi':'Ishdasiz';

if(!OK){try{const c=await pos();const{error}=await db.rpc('mark',{k,la:c.latitude,ln:c.longitude,ac:c.accuracy??null});if(error)throw error;go('home')}catch(e){alert(e.message||e)}return}
